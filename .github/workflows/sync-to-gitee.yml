name: Sync to Gitee

on:
  push:
    branches:
      - "**"
  delete:
    branches:
      - "**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      # 关键点：使用 GITHUB_TOKEN 来从 GitHub 克隆代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 配置 SSH 密钥并推送到 Gitee
      # 关键点：使用 GITEE_SSH_KEY 来推送到 Gitee
      - name: Sync to Gitee
        uses: wearerequired/git-mirror-action@master
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_KEY }}
        with:
          # 源仓库地址（使用 HTTPS 格式，避免再次触发 SSH 验证）
          source-repo: "https://github.com/only1nn/deepseek-harness.git"
          # 目标仓库地址（使用 SSH 格式）
          destination-repo: "git@gitee.com:liu_houlin/deepseek-harness.git"
